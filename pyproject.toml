[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muon-associative-memory"
version = "0.1.0"
description = "Experiments on optimizer dynamics in associative memory"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hydra-core==1.3.2",
    "scipy>=1.12,<2",
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
# PyTorch stopped publishing current wheels for Intel Macs. Keep the local
# development machine on the final compatible release while allowing current
# PyTorch on supported CPU platforms.
cpu = [
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.11.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
# CUDA wheels are intentionally explicit: a CPU installation should never
# acquire several gigabytes of CUDA runtime packages by accident.
cu126 = [
    "torch==2.11.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
muon-smoke = "muon_assoc.smoke:main"
muon-ode = "ode.run:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
notebook = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "matplotlib>=3.8,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/muon_assoc", "src/ode"]

[tool.hatch.build]
include = [
    "src/muon_assoc/**/*.py",
    "src/muon_assoc/conf/**/*.yaml",
    "src/ode/**/*.py",
    "src/ode/conf/**/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pypi", extra = "cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
